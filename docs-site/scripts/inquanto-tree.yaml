# InQuanto 公开文档站全树（截至 2026-04-30）→ qchem-stack 镜像 manifest
#
# 结构：
#   <section_key>:
#     title_zh / title_en
#     inquanto: 相对 https://docs.quantinuum.com/inquanto/ 的路径
#     diataxis: concept | tutorial | reference | parity
#     pillar: P1 | P2 | P3 | P4 | meta
#     status: shipped | partial | placeholder | not-applicable
#     qchem: 对应的 qchem_stack 模块路径（可省）
#     milestone: 计划里程碑（占位时必填）
#     summary_zh / summary_en: 一句话定义（生成器写入正文）
#     children: 同结构嵌套
#
# 状态语义：
#   shipped         - qchem_stack 中已等价或更优地落地
#   partial         - 接口/字段已就绪，但语义不与 InQuanto 完全等价
#   placeholder     - 已为其在站点保留位置；尚未在 qchem_stack 实现
#   not-applicable  - 公开 parity 矩阵口径明示不对齐（云/计费/硬件）
#
# 任何节点没有 status 视为父节点继承；叶子节点必须显式声明。

