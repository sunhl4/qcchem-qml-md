name: Deploy Docs

on:
  push:
    branches: [main, master]
    paths:
      - 'docusaurus-site/**'
      - 'scripts/check_doc_links.py'
      - 'scripts/check_algorithm_deep_read_coverage.py'
      - 'scripts/check_tutorial_verify_blocks.py'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python (docs gates)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Doc link gate
        run: python scripts/check_doc_links.py
      - name: Algorithm deep-read coverage
        run: python scripts/check_algorithm_deep_read_coverage.py
      - name: Tutorial verify blocks
        run: python scripts/check_tutorial_verify_blocks.py
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docusaurus-site/package-lock.json
      - name: Install and build
        working-directory: docusaurus-site
        run: |
          npm ci
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docusaurus-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
