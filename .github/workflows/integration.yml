name: Integration

on:
  workflow_call:

jobs:
  contract-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qchem
          POSTGRES_PASSWORD: qchem
          POSTGRES_DB: qchem_jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qchem -d qchem_jobs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api,quantum,chem]"
      - name: UQC mock + MD/ML pipeline (no hardware, not slow)
        run: pytest tests/quantum/test_uqc_mock_md_ml_integration.py -m "uqc_mock and not slow" -q --tb=short
      - name: HTTP API optional extra (FastAPI)
        run: pytest tests/api/test_api_runs.py -q --tb=short
      - name: Smoke orchestration (PySCF)
        run: |
          python -c "import pyscf"
          QCHEM_SMOKE_REQUIRE_PYSCF=1 python scripts/smoke_pipeline.py
      - name: Smoke orchestration VQD path (PySCF)
        run: python scripts/smoke_pipeline.py --excited-only
      - name: Smoke orchestration IQEB (PySCF)
        run: python scripts/smoke_pipeline.py --iqeb
      - name: Smoke projection L1 trace (PySCF)
        run: python scripts/smoke_pipeline.py --projection-trace
      - name: Pytket bridge (optional extra)
        run: pytest tests/test_pytket_bridge.py -q --tb=short
      - name: Smoke Qiskit Pauli shots (optional extra)
        run: python scripts/smoke_pipeline.py --qiskit-shots
      - name: Smoke sampled Pauli protocol (PySCF)
        run: python scripts/smoke_pipeline.py --sampled
      - name: Postgres job store smoke
        env:
          QCHEM_JOB_DATABASE_URL: postgresql://qchem:qchem@localhost:5432/qchem_jobs
        run: |
          pip install -e ".[jobs-postgres]"
          pytest tests/jobs/test_job_store_postgres.py tests/jobs/test_job_store_protocol_conformance.py -q --tb=short
      - name: QPE dual-track demo (no PySCF)
        run: python scripts/run_qpe_track_demo.py
