name: Nightly

on:
  workflow_call:

jobs:
  test-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Slow and perf tests
        run: pytest tests -q --tb=short -m "slow or perf" --no-cov
      - name: Perf regression gate (strict on nightly)
        env:
          QCHEM_PERF_REGRESSION_STRICT: "1"
        run: python scripts/check_perf_regression.py --report /tmp/perf-regression-report.json
      - name: Upload perf regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression-report
          path: /tmp/perf-regression-report.json
          if-no-files-found: warn
      - name: L3 benchmarks (optional gate)
        env:
          QCHEM_RUN_L3: "1"
        run: pytest -m l3 -q --tb=short --no-cov
      - name: Benchmark dashboard from L3 artifact
        run: |
          python scripts/l3_algorithm_benchmark_report.py --output /tmp/l3_benchmark.json 2>/dev/null || \
            echo '{"algorithm_benchmark_bundle_v1":{"schema":"algorithm_benchmark_bundle_v1","rows":[]}}' > /tmp/l3_benchmark.json
          python scripts/benchmark_dashboard/generate.py \
            --input /tmp/l3_benchmark.json \
            --md-summary tests/fixtures/md_validation_summary.json \
            --git-sha "${{ github.sha }}" \
            --output /tmp/benchmark_dashboard_nightly.html
      - name: Upload L3 benchmark bundle
        uses: actions/upload-artifact@v4
        with:
          name: l3-benchmark-bundle-nightly
          path: /tmp/l3_benchmark.json
          if-no-files-found: warn

  test-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest (cross-platform smoke)
        run: pytest tests -q --tb=short -m "not slow and not perf" --cov-fail-under=80
