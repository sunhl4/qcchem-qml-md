name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Upload to TestPyPI only (no production)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release precheck deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,chem]"

      - name: Release precheck (quick)
        run: ./scripts/release_precheck.sh --quick

  build-and-publish:
    needs: precheck
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Smoke install wheel
        run: |
          python -m venv /tmp/qchem-wheel-smoke
          /tmp/qchem-wheel-smoke/bin/pip install -U pip
          WHEEL=$(ls dist/*.whl | head -1)
          /tmp/qchem-wheel-smoke/bin/pip install "${WHEEL}[chem]"
          /tmp/qchem-wheel-smoke/bin/qchem-run --scenario minimal_vqe --json-summary

      - name: Publish to TestPyPI (dry-run / manual)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

      - name: Publish to PyPI (release)
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
