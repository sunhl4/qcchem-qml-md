name: Security

on:
  workflow_call:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev extras + pip-audit
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pip-audit
      - name: pip-audit (dev install surface)
        run: python scripts/run_pip_audit.py
      - name: pip-audit (chem,api install surface)
        run: |
          pip install -e ".[chem,api]"
          python scripts/run_pip_audit.py
