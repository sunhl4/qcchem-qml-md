name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly at 02:17 UTC so test-nightly (slow/perf/L3) actually runs.
    - cron: "17 2 * * *"

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  typecheck:
    needs: lint
    uses: ./.github/workflows/typecheck.yml

  test:
    needs: lint
    uses: ./.github/workflows/test.yml

  contract-docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api]"
      - name: OpenAPI snapshot sync
        run: |
          python scripts/generate_openapi_snapshot.py
          git diff --exit-code docs/generated/openapi_snapshot.json
      - name: Pipeline JSON schema snapshot sync
        run: |
          python scripts/generate_pipeline_schema_snapshot.py
          git diff --exit-code docs/generated/pipeline_result_v1.schema.json docs/generated/run_summary_v1.schema.json
      - name: Pre-quantum docs sync check
        run: |
          python scripts/sync_pre_quantum_docs.py
          git diff --exit-code docs/pre_quantum_yaml_matrix.md "docs/技术文档_双线路经典输入与统一PreQuantumInput契约.md"
      - name: Config reference snippets sync
        run: |
          python scripts/generate_config_reference_snippets.py
          git diff --exit-code docs/generated/
      - name: Configs catalog snippet sync
        run: |
          python scripts/generate_configs_catalog.py
          git diff --exit-code docs/generated/configs_catalog_snippet.md
          git diff --exit-code docusaurus-site/docs/reference/configs-catalog-body.md
      - name: Parity gap snippet sync
        run: |
          python scripts/generate_parity_gap_snippet.py
          git diff --exit-code docs/generated/parity_gap_snippet.md
      - name: Config combo matrix gate
        run: python scripts/check_config_combo_matrix.py
      - name: Product gap categories validator
        run: |
          python -c "from qchem_stack.protocols.product_contract import validate_product_gap_categories; errs=validate_product_gap_categories(); assert not errs, errs"
      - name: SDK doc sync
        run: python scripts/check_sdk_docs_sync.py
      - name: Check dependency constraints freshness
        run: |
          pip install pip-tools
          python scripts/check_constraints_freshness.py

  contract-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,chem]"
      - name: Scenario-first CLI smoke
        run: qchem-run --scenario minimal_vqe --json-summary
      - name: Examples tutorials smoke
        run: python examples/run_all_smoke.py
      - name: Validate notebooks (nbmake)
        run: pytest --nbmake notebooks/ --nbmake-timeout=120 -v
      - name: Smoke orchestration precomputed lane (no PySCF)
        run: python scripts/smoke_pipeline.py --precomputed-only
      - name: Parity criteria export (no PySCF run)
        run: python scripts/export_parity_criteria_table.py configs/example_h2.yaml
      - name: Parity export schema v3 stable keys
        run: |
          python scripts/export_parity_criteria_table.py configs/example_h2.yaml | python -c "import json,sys;d=json.load(sys.stdin);assert d.get('parity_export_schema_version')=='3';c=d['computable_abstract'];assert c.get('schema')=='qchem_computable_abstract_v2';assert isinstance(d.get('capability_gap_categories'),list);assert d.get('embedding',{}).get('mode')=='none'"
      - name: Parity export multi-config L1 gate (check_parity_export_sample)
        run: python scripts/check_parity_export_sample.py
      - name: Benchmark dashboard artifact (L3 + MD/ML AL + pipeline profile)
        run: |
          echo '{"bundle_schema_version":"1","algorithm_benchmark_bundle_v1":{"schema":"algorithm_benchmark_bundle_v1","rows":[]}}' > /tmp/l3_empty.json
          echo '{"schema":"pipeline_profile_v1","stages":[{"stage":"scf_done","duration_ms":1.0,"peak_memory_kb":512}]}' > /tmp/pipeline_profile.json
          python scripts/benchmark_dashboard/generate.py \
            --input /tmp/l3_empty.json \
            --md-summary tests/fixtures/md_validation_summary.json \
            --pipeline-profile /tmp/pipeline_profile.json \
            --git-sha "${{ github.sha }}" \
            --output /tmp/benchmark_dashboard.html
      - name: Upload benchmark dashboard HTML
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dashboard-html
          path: /tmp/benchmark_dashboard.html
          if-no-files-found: error

  integration:
    needs: lint
    uses: ./.github/workflows/integration.yml

  test-md-bridge-l1:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with qmlff extra
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,chem,qmlff]"
      - name: Pytest l1_md_ml (nightly jax-md paths)
        run: pytest tests -q --tb=short -m l1_md_ml

  test-fast-path:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest (config / orchestration / protocols / repro / md_bridge / mitigation)
        run: pytest tests/config tests/orchestration tests/protocols tests/repro tests/md_bridge tests/mitigation -q --tb=short -n auto

  test-optional-extras:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional extras (install profile matrix subset)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,pytket,nexus,jobs-postgres,observability]" || pip install -e ".[dev]"
      - name: Pytket bridge smoke
        run: pytest tests/test_pytket_bridge.py -q --tb=short
      - name: Nexus optional probe
        run: python -c "from qchem_stack.integrations.nexus_optional import nexus_installation_status; print(nexus_installation_status())"
      - name: Observability extra import probe
        run: python -c "from qchem_stack.orchestration import pipeline_otel_subscriber; print('otel_module_ok')"

  test-optional-backends:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install cirq amazon-braket-sdk 2>/dev/null || true
      - name: Cirq and Braket backend conformance
        run: pytest tests/backends/test_p4_backend_conformance.py -k "cirq or braket" -q --tb=short

  test-psi4:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install micromamba and Psi4 env
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          export MAMBA_ROOT_PREFIX="$GITHUB_WORKSPACE/.micromamba"
          ./bin/micromamba create -y -p "$MAMBA_ROOT_PREFIX/envs/.conda-psi4" \
            -c conda-forge python=3.12 psi4 pyscf pytest pydantic pyyaml openfermion scipy pandas opt_einsum
          "$MAMBA_ROOT_PREFIX/envs/.conda-psi4/bin/python" -m pip install -U pip
          "$MAMBA_ROOT_PREFIX/envs/.conda-psi4/bin/python" -m pip install -e ".[dev]"
      - name: Psi4 cross-backend tests
        run: |
          export PY="$GITHUB_WORKSPACE/.micromamba/envs/.conda-psi4/bin/python"
          "$PY" -c "import psi4, pyscf; print(psi4.__version__, pyscf.__version__)"
          "$PY" -m pytest -m psi4 -q --tb=short
      - name: Psi4 end-to-end pipeline smoke
        run: |
          export PY="$GITHUB_WORKSPACE/.micromamba/envs/.conda-psi4/bin/python"
          "$PY" -c "
          from pathlib import Path
          from qchem_stack.orchestration.pipeline import run_pipeline_from_config
          out = run_pipeline_from_config('configs/example_h2_psi4_rhf_sto3g.yaml')
          assert out.get('scf_energy') is not None
          print('psi4 smoke scf_energy', out['scf_energy'])
          "

  security:
    needs: lint
    uses: ./.github/workflows/security.yml

  nightly:
    needs: lint
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[nightly]')
    uses: ./.github/workflows/nightly.yml

  docusaurus:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docusaurus-site/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Docusaurus config links
        run: python scripts/check_doc_links.py
      - name: Install site deps
        working-directory: docusaurus-site
        run: npm ci
      - name: Docusaurus production build
        working-directory: docusaurus-site
        run: npm run build
      - name: npm audit (docusaurus dependencies, blocking on high)
        working-directory: docusaurus-site
        run: npm audit --audit-level=high
