name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: |
          python -m pip install -U pip
          pip install "ruff>=0.3"
      - name: Ruff check (src + tests + scripts + examples)
        run: ruff check src/qchem_stack tests scripts examples
      - name: Ruff format (check only)
        run: ruff format --check src/qchem_stack tests scripts examples

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pre-quantum docs sync check
        run: |
          python scripts/sync_pre_quantum_docs.py
          git diff --exit-code docs/pre_quantum_yaml_matrix.md "docs/技术文档_双线路经典输入与统一PreQuantumInput契约.md"
      - name: Strict repro JSON API
        run: python -c "from qchem_stack.repro.export import repro_json_dumps; repro_json_dumps({'ok': True})"
      - name: Pytest
        run: pytest tests -q --tb=short
      - name: Examples tutorials smoke
        run: python examples/run_all_smoke.py
      - name: L1 excited regression (marker)
        run: pytest -m l1_excited -q --tb=short
      - name: L1 MD/ML bridge (marker)
        run: pytest -m l1_md_ml -q --tb=short
      - name: HTTP API optional extra (FastAPI)
        run: |
          pip install -e ".[api]"
          pytest tests/test_api_runs.py -q --tb=short
      - name: Smoke orchestration precomputed lane (no PySCF)
        run: python scripts/smoke_pipeline.py --precomputed-only
      - name: Smoke orchestration (PySCF)
        run: python scripts/smoke_pipeline.py
      - name: Smoke orchestration VQD path (PySCF)
        run: python scripts/smoke_pipeline.py --excited-only
      - name: Smoke orchestration IQEB (PySCF)
        run: python scripts/smoke_pipeline.py --iqeb
      - name: Smoke projection L1 trace (PySCF)
        run: python scripts/smoke_pipeline.py --projection-trace
      - name: Parity criteria export (no PySCF run)
        run: python scripts/export_parity_criteria_table.py configs/example_h2.yaml | head -c 4000
      - name: Parity export schema v3 stable keys
        run: |
          python scripts/export_parity_criteria_table.py configs/example_h2.yaml | python -c "import json,sys;d=json.load(sys.stdin);assert d.get('parity_export_schema_version')=='3';c=d['computable_abstract'];assert c.get('schema')=='qchem_computable_abstract_v2';assert isinstance(d.get('capability_gap_categories'),list);assert d.get('embedding',{}).get('mode')=='none'"
      - name: Parity export multi-config L1 gate (check_parity_export_sample)
        run: python scripts/check_parity_export_sample.py
      - name: Pytket bridge (optional extra)
        run: pytest tests/test_pytket_bridge.py -q --tb=short
      - name: Smoke Qiskit Pauli shots (optional extra)
        run: python scripts/smoke_pipeline.py --qiskit-shots
      - name: Smoke sampled Pauli protocol (PySCF)
        run: python scripts/smoke_pipeline.py --sampled
      - name: QPE dual-track demo (no PySCF)
        run: python scripts/run_qpe_track_demo.py

  test-psi4:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install stack and Psi4 (optional)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install psi4 || true
      - name: Psi4 pre-quantum tests
        run: pytest tests/test_psi4_pre_quantum_pipeline.py -m psi4 -q --tb=short

  docusaurus:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docusaurus-site/package-lock.json
      - name: Install site deps
        working-directory: docusaurus-site
        run: npm ci
      - name: Docusaurus production build
        working-directory: docusaurus-site
        run: npm run build
