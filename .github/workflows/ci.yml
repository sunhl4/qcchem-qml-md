name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly at 02:17 UTC so test-nightly (slow/perf/L3) actually runs.
    - cron: "17 2 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: |
          python -m pip install -U pip
          pip install "ruff>=0.3"
      - name: Ruff check (src + tests + scripts + examples)
        run: ruff check src/qchem_stack tests scripts examples
      - name: Ruff format (check only)
        run: ruff format --check src/qchem_stack tests scripts examples
      - name: Import layer boundaries
        run: python scripts/check_import_layers.py
      - name: Comparative execution backlog validator
        run: python scripts/check_comparative_execution_backlog.py

  typecheck-config:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + pyright
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pyright
      - name: Pyright (config, exceptions, repro)
        run: pyright src/qchem_stack/config src/qchem_stack/repro src/qchem_stack/exceptions.py

  typecheck-stack:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + pyright
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pyright
      - name: Pyright (full src/qchem_stack)
        run: pyright src/qchem_stack

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pre-quantum docs sync check
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python scripts/sync_pre_quantum_docs.py
          git diff --exit-code docs/pre_quantum_yaml_matrix.md "docs/技术文档_双线路经典输入与统一PreQuantumInput契约.md"
      - name: Config reference snippets sync
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python scripts/generate_config_reference_snippets.py
          git diff --exit-code docs/generated/
      - name: Strict repro JSON API
        run: |
          python -c "from qchem_stack.repro.export import repro_json_dumps; repro_json_dumps({'ok': True})"
      - name: Product gap categories validator
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -c "from qchem_stack.protocols.product_contract import validate_product_gap_categories; errs=validate_product_gap_categories(); assert not errs, errs"
      - name: Pytest
        run: pytest tests -q --tb=short -m "not slow and not perf"
      - name: Backend statevector conformance (PR smoke)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: pytest tests/backends/test_p4_backend_conformance.py -k statevector -q --tb=short
      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov-py312
          path: htmlcov/
          if-no-files-found: warn
      # The main Pytest step above already runs the l1_excited and l1_md_ml
      # markers (they are not slow/perf), so dedicated marker reruns are
      # redundant and have been removed. The remaining heavy smokes and
      # optional extras run only on 3.12 Ubuntu to keep the matrix cheap; 3.10/3.11
      # provide cross-version coverage via the core unit-test run.
      - name: Check examples importable (syntax and import validation)
        run: python scripts/check_examples_importable.py
      - name: Check dependency constraints freshness
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pip install pip-tools
          python scripts/check_constraints_freshness.py
      - name: Examples tutorials smoke
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python examples/run_all_smoke.py
      - name: Validate notebooks (nbmake)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pytest --nbmake notebooks/ --nbmake-timeout=120 -v
      - name: UQC mock + MD/ML pipeline (no hardware, not slow)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: pytest tests/test_uqc_mock_md_ml_integration.py -m "uqc_mock and not slow" -q --tb=short
      - name: HTTP API optional extra (FastAPI)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pip install -e ".[api]"
          pytest tests/test_api_runs.py -q --tb=short
      - name: Smoke orchestration precomputed lane (no PySCF)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/smoke_pipeline.py --precomputed-only
      - name: Smoke orchestration (PySCF)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -c "import pyscf"
          QCHEM_SMOKE_REQUIRE_PYSCF=1 python scripts/smoke_pipeline.py
      - name: Smoke orchestration VQD path (PySCF)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/smoke_pipeline.py --excited-only
      - name: Smoke orchestration IQEB (PySCF)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/smoke_pipeline.py --iqeb
      - name: Smoke projection L1 trace (PySCF)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/smoke_pipeline.py --projection-trace
      - name: Parity criteria export (no PySCF run)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/export_parity_criteria_table.py configs/example_h2.yaml
      - name: Parity export schema v3 stable keys
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python scripts/export_parity_criteria_table.py configs/example_h2.yaml | python -c "import json,sys;d=json.load(sys.stdin);assert d.get('parity_export_schema_version')=='3';c=d['computable_abstract'];assert c.get('schema')=='qchem_computable_abstract_v2';assert isinstance(d.get('capability_gap_categories'),list);assert d.get('embedding',{}).get('mode')=='none'"
      - name: Parity export multi-config L1 gate (check_parity_export_sample)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/check_parity_export_sample.py
      - name: Benchmark dashboard artifact (L3 + MD/ML AL + pipeline profile)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          echo '{"bundle_schema_version":"1","algorithm_benchmark_bundle_v1":{"schema":"algorithm_benchmark_bundle_v1","rows":[]}}' > /tmp/l3_empty.json
          echo '{"schema":"pipeline_profile_v1","stages":[{"stage":"scf_done","duration_ms":1.0,"peak_memory_kb":512}]}' > /tmp/pipeline_profile.json
          python scripts/benchmark_dashboard/generate.py \
            --input /tmp/l3_empty.json \
            --md-summary tests/fixtures/md_validation_summary.json \
            --pipeline-profile /tmp/pipeline_profile.json \
            --git-sha "${{ github.sha }}" \
            --output /tmp/benchmark_dashboard.html
      - name: Upload benchmark dashboard HTML
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dashboard-html
          path: /tmp/benchmark_dashboard.html
          if-no-files-found: error
      - name: Pytket bridge (optional extra)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: pytest tests/test_pytket_bridge.py -q --tb=short
      - name: Smoke Qiskit Pauli shots (optional extra)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/smoke_pipeline.py --qiskit-shots
      - name: Smoke sampled Pauli protocol (PySCF)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/smoke_pipeline.py --sampled
      - name: QPE dual-track demo (no PySCF)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/run_qpe_track_demo.py

  test-nightly:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[nightly]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Slow and perf tests
        run: pytest tests -q --tb=short -m "slow or perf"
      - name: L3 benchmarks (optional gate)
        env:
          QCHEM_RUN_L3: "1"
        run: pytest -m l3 -q --tb=short
      - name: Benchmark dashboard from L3 artifact
        run: |
          python scripts/l3_algorithm_benchmark_report.py --output /tmp/l3_benchmark.json 2>/dev/null || \
            echo '{"algorithm_benchmark_bundle_v1":{"schema":"algorithm_benchmark_bundle_v1","rows":[]}}' > /tmp/l3_benchmark.json
          python scripts/benchmark_dashboard/generate.py \
            --input /tmp/l3_benchmark.json \
            --md-summary tests/fixtures/md_validation_summary.json \
            --git-sha "${{ github.sha }}" \
            --output /tmp/benchmark_dashboard_nightly.html

  test-optional-backends:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install cirq amazon-braket-sdk 2>/dev/null || true
      - name: Cirq and Braket backend conformance
        run: pytest tests/backends/test_p4_backend_conformance.py -k "cirq or braket" -q --tb=short

  test-psi4:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install micromamba and Psi4 env
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          export MAMBA_ROOT_PREFIX="$GITHUB_WORKSPACE/.micromamba"
          ./bin/micromamba create -y -p "$MAMBA_ROOT_PREFIX/envs/.conda-psi4" \
            -c conda-forge python=3.12 psi4 pyscf pytest pydantic pyyaml openfermion scipy pandas opt_einsum
          "$MAMBA_ROOT_PREFIX/envs/.conda-psi4/bin/python" -m pip install -U pip
          "$MAMBA_ROOT_PREFIX/envs/.conda-psi4/bin/python" -m pip install -e ".[dev]"
      - name: Psi4 cross-backend tests
        run: |
          export PY="$GITHUB_WORKSPACE/.micromamba/envs/.conda-psi4/bin/python"
          "$PY" -c "import psi4, pyscf; print(psi4.__version__, pyscf.__version__)"
          "$PY" -m pytest -m psi4 -q --tb=short
      - name: Psi4 end-to-end pipeline smoke
        run: |
          export PY="$GITHUB_WORKSPACE/.micromamba/envs/.conda-psi4/bin/python"
          "$PY" -c "
          from pathlib import Path
          from qchem_stack.orchestration.pipeline import run_pipeline_from_config
          out = run_pipeline_from_config('configs/example_h2_psi4_rhf_sto3g.yaml')
          assert out.get('scf_energy') is not None
          print('psi4 smoke scf_energy', out['scf_energy'])
          "

  security-audit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev extras + pip-audit
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pip-audit
      - name: pip-audit (dev install surface)
        run: pip-audit --skip-editable --desc on

  docusaurus:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docusaurus-site/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Docusaurus config links
        run: python scripts/check_doc_links.py
      - name: Install site deps
        working-directory: docusaurus-site
        run: npm ci
      - name: Docusaurus production build
        working-directory: docusaurus-site
        run: npm run build
      - name: npm audit (docusaurus dependencies, blocking on high)
        working-directory: docusaurus-site
        run: npm audit --audit-level=high
