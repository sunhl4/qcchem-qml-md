# H₂：量子键长扫描建集 → 预训练力场 → 50 轮在线学习（非零样本）
# 同 example_h2_qmlff_bondscan_ol_20rounds.yaml，加长扫描与轮次。

max_rounds: 50
energy_tolerance_hartree: 5.0e-4
n_candidate_frames: 2
add_top_k_per_round: 1
label_energy_reference: variational
validation_energy_reference: variational
validation_theory_level: full_pipeline
label_screening_theory_level: full_pipeline
label_top_theory_level: full_pipeline
include_hf_nuclear_gradient: true
dedupe_decimals: 4
validation_skip_initial_md_frame: false

# Phase A：更密的键长扫描
n_seed_geometries: 20
seed_mode: bond_stretch
seed_bond_min_bohr: 0.7
seed_bond_max_bohr: 2.5

# Phase B：预训练
pretrain_epochs: 150

# Phase C：在线学习
round_bonds_per_round: 1
stop_on_md_converged: false
n_epochs_per_round: 25
warm_start: true
warm_start_params_only: true

force_field_backend: qmlff_preset
qmlff_preset: atomic_amplitude
qmlff_builder_overrides:
  n_qubits: 6
  n_layers: 2
qmlff_species_list: [H]

batch_size: 1
learning_rate: 1.0e-3
lr_scheduler: constant
force_weight: 10.0
energy_normalization: none

md_ensemble: nvt_langevin
md_init_frame: base
md_n_steps: 40
md_dt_fs: 0.25
md_temperature_K: 100.0
md_save_stride: 10
md_seed: 0
md_gamma_ps_inv: 0.1
md_tau_fs: 100.0
max_neighbors: 16

write_per_round_extxyz: true
seed: 0
