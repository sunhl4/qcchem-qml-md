[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qchem-stack"
version = "1.1.0"
description = "Quantum chemistry orchestration: classical downfolding, protocols, ML fusion, MD bridge"
readme = "README_PYPI.md"
# Full prose remains in repository README.md (may use non-ASCII on some filesystems).
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yaozheng" }]
keywords = ["quantum-chemistry", "vqe", "workflow", "reproducibility"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "opt-einsum>=3.3",
    "scipy>=1.11",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "openfermion>=1.5",
    "pandas>=2.0",
    "typing_extensions>=4.6; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/sunhl4/qcchem-qml-md"
Repository = "https://github.com/sunhl4/qcchem-qml-md"
Documentation = "https://sunhl4.github.io/qcchem-qml-md/"
"Release process" = "https://github.com/sunhl4/qcchem-qml-md/blob/main/docs/engineering/pypi_release.md"

[project.optional-dependencies]
chem = ["pyscf>=2.4"]
# Qiskit 2.x is required for both quantum and uqc extras ([all]/[all-cloud]/[dev] resolve consistently).
quantum = ["qiskit>=2.0", "qiskit-aer>=0.13"]
pytket = ["pytket>=1.25"]
nexus = ["qnexus>=0.4"]
# Native GQE (Plan B): JAX generative model; quantum scoring stays on stack executors.
gqe = ["jax>=0.4", "optax>=0.2"]
uqc = ["uqc-client>=0.1", "qiskit>=2.0", "qiskit-aer>=0.13"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "slowapi>=0.1.9"]
jobs-postgres = ["psycopg[binary]>=3.1"]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Optional MD bridge to the sibling QML-FF project.
# QML-FF is not on PyPI under this name; install it from your local checkout, e.g.:
#   pip install -e /path/to/QML-FF
# Then add `jax-md` separately. We only declare the JAX-MD dependency here because
# qmlff is meant to live alongside this repo as a sibling editable install.
qmlff = ["jax-md>=0.2"]
# Note: "md-classical" is an install *profile name* (chem only / classical H₂ FF + QMEF),
# not a pip extra — see docs/engineering/install_profiles.md.
all = ["qchem-stack[chem,quantum,pytket,nexus]"]
all-cloud = ["qchem-stack[all,uqc]"]
dev = [
    "qchem-stack[chem,quantum,api]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.3",
    "pre-commit>=3.8",
    "pyright>=1.1",
    "hypothesis>=6.0",
    "nbmake>=1.4",
    "pip-tools>=7.0",
    "import-linter>=2.0",
]
dev-uqc = ["qchem-stack[dev,uqc]"]
examples_viz = ["matplotlib>=3.7"]

[project.scripts]
qchem-run = "qchem_stack.cli:main_run"
qchem-export-parity = "qchem_stack.cli:main_export_parity"
qchem-jobs-worker = "qchem_stack.jobs.worker:main"

[project.entry-points."qchem_stack.chem_solvers"]
mock_external = "qchem_stack.chem.solvers.mock_external_solver_example:MockExternalIntegralSolver"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"share/qchem-stack/configs" = [
  "configs/*.yaml",
  "configs/*.json",
  "configs/*.md",
  "configs/scenarios/*.yaml",
  "configs/profiles/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Include repo root so ``import examples.*`` and ``import tests.helpers.*`` work under pytest.
pythonpath = [".", "src"]
addopts = [
    "--cov=src/qchem_stack",
    "--cov-report=term-missing",
    "--cov-report=html",
]
# The 80% coverage gate is enforced on the full test suite via explicit
# ``--cov-fail-under=79`` on the Pytest step (v1.1 baseline; raise to 80 in v1.2).
markers = [
    "l3: optional deep numerical benchmarks (QCHEM_RUN_L3=1)",
    "l1_excited: VQD/QSE/SCEOM unit tests (selective CI: pytest -m l1_excited)",
    "l1_md_ml: MD/ML bridge smoke (pytest -m l1_md_ml)",
    "uqc_mock: UQC cloud mock backend + MD/ML integration (no real hardware)",
    "slow: optional heavier chemistry smoke (DMET multi-fragment exact, etc.)",
    "pyscf: requires PySCF installed",
    "psi4: requires Psi4 installed (optional CI job)",
    "no_pyscf: subprocess isolates precomputed lane without PySCF import",
    "perf: soft wall-time guards (local/nightly only)",
    "gqe: GPT-QE / integrations.gqe (requires pip install 'qchem-stack[gqe]')",
]

[tool.coverage.run]
branch = true
source = ["src/qchem_stack"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/scripts/*",
    # TypedDict-only schema modules (no runtime logic; import smoke in tests/).
    "*/quantum/algorithms/excited_basis_types.py",
    "*/protocols/protocol_counts_schema.py",
    "*/repro/schema.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# No `fail_under` here: the 79% gate is enforced only via the explicit
# `--cov-fail-under=79` CLI flag on the full test suite (see .github/workflows
# /test.yml Pytest step; v1.1 baseline — raise to 80 in v1.2). Narrow/targeted
# pytest invocations (PR smoke, optional backends, pytket bridge, integration
# smoke) inherit --cov from addopts but must NOT fail on a threshold they
# cannot reach.
show_missing = true
skip_covered = false

# Type checking uses pyright (see CI typecheck-config / typecheck-stack jobs and
# the [tool.pyright] section below). mypy is intentionally not part of the
# toolchain to avoid maintaining two type-checker configurations.

# CI **lint** job: `ruff check` + `ruff format --check` on `src/qchem_stack`,
# `tests`, `scripts`, `examples` (`.github/workflows/ci.yml`). Pre-commit mirrors
# that scope in `.pre-commit-config.yaml` when `pre-commit install` has been run.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
]
ignore = []
extend-select = ["TC", "B", "SIM", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["qchem_stack"]

# Tests use ``pytest.importorskip`` before importing qchem_stack / PySCF — imports are intentionally not at file top.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "TC001", "TC002", "TC003"]
"scripts/**" = ["TC001", "TC002", "TC003"]
"examples/**" = ["TC001", "TC002", "TC003"]
"src/qchem_stack/api/**" = ["TC001"]
"src/qchem_stack/chem/drivers/pyscf_driver.py" = ["E402"]
"src/qchem_stack/chem/embedding/schmidt_production.py" = ["E402"]
"src/qchem_stack/__init__.py" = ["E402"]
"src/qchem_stack/orchestration/pipeline_events.py" = ["TC003"]
"src/qchem_stack/orchestration/pipeline_assembly.py" = ["TC001"]
"src/qchem_stack/orchestration/pipeline_sync_runner.py" = ["TC001", "TC003"]
"src/qchem_stack/orchestration/pipeline_sync_context.py" = ["TC001"]
"src/qchem_stack/orchestration/pipeline_stage_runners.py" = ["TC001"]
"src/qchem_stack/orchestration/excited_stages_resource.py" = ["TC001"]
"src/qchem_stack/orchestration/stage_registry.py" = ["TC001", "TC003"]
"src/qchem_stack/config/migrations.py" = ["E402"]
"src/qchem_stack/protocols/computable.py" = ["E402"]
"src/qchem_stack/jobs/pipeline_runner.py" = ["TC003"]
"src/qchem_stack/protocols/computables/list_for_config.py" = ["TC001"]
"src/qchem_stack/backends/factory.py" = ["TC003"]
"src/qchem_stack/chem/precomputed_bundle.py" = ["TC003"]
"src/qchem_stack/chem/solvers/registry.py" = ["TC003"]
"src/qchem_stack/config/migrations_v2_to_v3.py" = ["TC003"]
"src/qchem_stack/config/scenarios.py" = ["TC003"]
"src/qchem_stack/sdk/__init__.py" = ["TC001"]
"src/qchem_stack/protocols/parity_export_merge.py" = ["TC003", "TC003"]

[tool.pyright]
include = ["src/qchem_stack"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = false
# openfermion re-exports its public API (FermionOperator, QubitOperator,
# jordan_wigner, bravyi_kitaev, get_sparse_operator, jw_hartree_fock_state)
# from deep submodules without a complete top-level __all__, so pyright's
# reportPrivateImportUsage flags them as private. These are stable public
# symbols; suppress the rule rather than chase sub-module import paths that
# break across openfermion releases.
reportPrivateImportUsage = "none"

# Tighten "untyped def" posture (pyright equivalent of mypy disallow_untyped_defs)
# on the orchestration / config / protocols packages first: every function in
# these layers must annotate its parameters.
#
# NOTE: ``reportExplicitAny`` is a BasedPyright extension and is a NO-OP under
# the standard Pyright this project uses (pyright>=1.1, see CI typecheck.yml and
# the pyright-python pre-commit hook). The ACTIVE strictness in each env below
# is ``reportMissingParameterType = "error"`` (recognized by standard pyright);
# ``reportExplicitAny`` is retained for parity and would activate if the project
# switches to basedpyright. See CHANGELOG "Known Issues".
[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/chem/solvers"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/contracts"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/config"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/repro"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/protocols/computables"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/protocols"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/orchestration"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/backends"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/quantum/algorithms"
reportMissingParameterType = "error"
reportExplicitAny = "error"

# quantum non-algorithms subpackages (variational_plugins, excited_plugins,
# algorithm_registry, ansatz_registry, operator_pool_registry, statevector,
# runtime, variational_branch, ...). ``quantum/algorithms`` keeps its own env
# above (longest-prefix match wins).
[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/quantum"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/jobs"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/chem"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/integrations"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/md_bridge"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/mitigation"
reportMissingParameterType = "error"
reportExplicitAny = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/api"
reportMissingParameterType = "error"
reportExplicitAny = "error"

