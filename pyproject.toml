[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qchem-stack"
version = "0.6.0"
description = "Quantum chemistry orchestration: classical downfolding, protocols, ML fusion, MD bridge"
readme = "README_PYPI.md"
# Full prose remains in repository README.md (may use non-ASCII on some filesystems).
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yaozheng" }]
keywords = ["quantum-chemistry", "vqe", "workflow", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "opt-einsum>=3.3",
    "scipy>=1.11",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "openfermion>=1.5",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/sunhl4/qcchem-qml-md"
Repository = "https://github.com/sunhl4/qcchem-qml-md"
Documentation = "https://github.com/sunhl4/qcchem-qml-md/tree/main/docs"
"Release process" = "https://github.com/sunhl4/qcchem-qml-md/blob/main/docs/engineering/pypi_release.md"

[project.optional-dependencies]
chem = ["pyscf>=2.4"]
# Qiskit 2.x is required for both quantum and uqc extras ([all]/[dev] resolve consistently).
quantum = ["qiskit>=2.0", "qiskit-aer>=0.13"]
pytket = ["pytket>=1.25"]
nexus = ["qnexus>=0.4"]
uqc = ["uqc-client>=0.1", "qiskit>=2.0", "qiskit-aer>=0.13"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "slowapi>=0.1.9"]
# Optional MD bridge to the sibling QML-FF project.
# QML-FF is not on PyPI under this name; install it from your local checkout, e.g.:
#   pip install -e /path/to/QML-FF
# Then add `jax-md` separately. We only declare the JAX-MD dependency here because
# qmlff is meant to live alongside this repo as a sibling editable install.
qmlff = ["jax-md>=0.2"]
all = ["qchem-stack[chem,quantum,pytket,nexus,uqc]"]
dev = ["qchem-stack[all,api]", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "pre-commit>=3.8", "pyright>=1.1", "hypothesis>=6.0", "nbmake>=1.4", "pip-tools>=7.0"]
examples_viz = ["matplotlib>=3.7"]

[project.scripts]
qchem-jobs-worker = "qchem_stack.jobs.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Include repo root so ``import examples.*`` and ``import tests.helpers.*`` work under pytest.
pythonpath = [".", "src"]
addopts = [
    "--cov=src/qchem_stack",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "l3: optional deep numerical benchmarks (QCHEM_RUN_L3=1)",
    "l1_excited: VQD/QSE/SCEOM unit tests (selective CI: pytest -m l1_excited)",
    "l1_md_ml: MD/ML bridge smoke (pytest -m l1_md_ml)",
    "uqc_mock: UQC cloud mock backend + MD/ML integration (no real hardware)",
    "slow: optional heavier chemistry smoke (DMET multi-fragment exact, etc.)",
    "pyscf: requires PySCF installed",
    "psi4: requires Psi4 installed (optional CI job)",
    "no_pyscf: subprocess isolates precomputed lane without PySCF import",
    "perf: soft wall-time guards (local/nightly only)",
]

[tool.coverage.run]
branch = true
source = ["src/qchem_stack"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
skip_covered = false

# Type checking uses pyright (see CI typecheck-config / typecheck-stack jobs and
# the [tool.pyright] section below). mypy is intentionally not part of the
# toolchain to avoid maintaining two type-checker configurations.

# CI **lint** job: `ruff check` + `ruff format --check` on `src/qchem_stack`,
# `tests`, `scripts`, `examples` (`.github/workflows/ci.yml`). Pre-commit mirrors
# that scope in `.pre-commit-config.yaml` when `pre-commit install` has been run.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
]
ignore = []
extend-select = ["TCH", "B", "SIM", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["qchem_stack"]

# Tests use ``pytest.importorskip`` before importing qchem_stack / PySCF — imports are intentionally not at file top.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "TCH001", "TCH002", "TCH003"]
"scripts/**" = ["TCH001", "TCH002", "TCH003"]
"examples/**" = ["TCH001", "TCH002", "TCH003"]
"src/qchem_stack/api/**" = ["TCH001"]
"src/qchem_stack/chem/drivers/pyscf_driver.py" = ["E402"]
"src/qchem_stack/chem/embedding/schmidt_production.py" = ["E402"]
"src/qchem_stack/__init__.py" = ["E402"]
"src/qchem_stack/orchestration/pipeline_events.py" = ["TCH003"]

[tool.pyright]
include = ["src/qchem_stack"]
typeCheckingMode = "basic"
reportMissingImports = false

# Tighten "untyped def" posture (pyright equivalent of mypy disallow_untyped_defs)
# on the orchestration / config / protocols packages first: every function in
# these layers must annotate its parameters.
[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/config"
reportMissingParameterType = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/protocols"
reportMissingParameterType = "error"

[[tool.pyright.executionEnvironments]]
root = "src/qchem_stack/orchestration"
reportMissingParameterType = "error"

