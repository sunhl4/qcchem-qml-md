# Optional OpenTelemetry OTLP stack for local pipeline tracing.
#
# Usage:
#   docker compose -f examples/observability/docker-compose.otlp.yaml up -d
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#   pip install -e ".[observability]"
#   qchem-run --scenario minimal_vqe

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
