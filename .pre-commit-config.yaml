# Optional: after `pip install -e ".[dev]"`: `pre-commit install`
# Match CI **lint** job: `ruff check` + `ruff format --check` on these paths:
# - see `.github/workflows/ci.yml`
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        files: ^(src/qchem_stack|tests|scripts|examples)/
      - id: ruff-format
        files: ^(src/qchem_stack|tests|scripts|examples)/

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.403
    hooks:
      - id: pyright
        name: pyright (config layer)
        files: ^src/qchem_stack/config/
        args: ["--project", "pyproject.toml"]
      - id: pyright
        name: pyright (full stack)
        files: ^src/qchem_stack/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          [
            "--skip=*.json,*.sqlite,*.lock,htmlcov,.git,*.egg-info,build,dist,docs/gqe_nakaji_repro_report.md",
            "--ignore-words=codespell-ignore.txt",
          ]
        exclude: ^docs/技术文档

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Import-layer contracts (same `lint-imports` as the CI lint.yml job).
  # Local hook only (CI runs ``lint-imports`` directly in lint.yml). Uses the
  # repo's `.venv` interpreter explicitly so it works from a plain shell without
  # activating the venv (pre-commit's isolated `language: python` env cannot
  # import the in-repo `qchem_stack` package).
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (import-linter contracts)
        entry: .venv/bin/lint-imports
        language: system
        files: \.importlinter$
        pass_filenames: false
