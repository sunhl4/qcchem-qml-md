# qchem-stack local stack: worker + optional API (slim image).
# Build: docker compose build
# HMAC: set QCHEM_PROTOCOL_HMAC_KEY in production (never use the dev default).
# Protocol blobs default to JSON v2 (QCHEM_PROTOCOL_BLOB_V2=1); set 0 only for legacy pickle write.

services:
  qchem-worker:
    build:
      context: .
      target: slim
    image: qchem-stack:slim
    container_name: qchem-worker
    volumes:
      - ./data:/data
      - ./configs:/configs:ro
    environment:
      - QCHEM_PROTOCOL_HMAC_KEY=${QCHEM_PROTOCOL_HMAC_KEY:-dev-hmac-key-change-in-production}
      - QCHEM_ALLOW_LEGACY_PICKLE=0
    command: ["qchem-jobs-worker", "--db", "/data/jobs.sqlite", "--workers", "4"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import qchem_stack; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qchem-api:
    build:
      context: .
      target: slim
    image: qchem-stack:slim
    container_name: qchem-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./configs:/configs:ro
    environment:
      - QCHEM_PROTOCOL_HMAC_KEY=${QCHEM_PROTOCOL_HMAC_KEY:-dev-hmac-key-change-in-production}
      - QCHEM_ALLOW_LEGACY_PICKLE=0
      - QCHEM_API_HOST=0.0.0.0
      - QCHEM_API_PORT=8000
      - QCHEM_JOB_DB=/data/jobs.sqlite
    command: ["python", "-m", "qchem_stack.api", "--host", "0.0.0.0", "--port", "8000", "--db", "/data/jobs.sqlite"]
    restart: unless-stopped
    depends_on:
      qchem-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  data:
    driver: local

networks:
  default:
    name: qchem-network
