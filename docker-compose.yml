# qchem-stack local stack: worker + optional API (slim image).
# Build: docker compose build
# HMAC: set QCHEM_PROTOCOL_HMAC_KEY in production (never use the dev default).
# Protocol blobs default to JSON v2 (QCHEM_PROTOCOL_BLOB_V2=1); set 0 only for legacy pickle write.

services:
  postgres:
    image: postgres:15
    container_name: qchem-postgres
    environment:
      POSTGRES_USER: qchem
      POSTGRES_PASSWORD: qchem
      POSTGRES_DB: qchem_jobs
    ports:
      - "5432:5432"
    volumes:
      - qchem_pg_data:/var/lib/postgresql/data
      - ./scripts/init_postgres_jobs.sql:/docker-entrypoint-initdb.d/01_jobs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qchem -d qchem_jobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  qchem-worker:
    build:
      context: .
      target: slim
    image: qchem-stack:slim
    container_name: qchem-worker
    volumes:
      - ./data:/data
      - ./configs:/configs:ro
    environment:
      - QCHEM_PROTOCOL_HMAC_KEY=${QCHEM_PROTOCOL_HMAC_KEY:?Set QCHEM_PROTOCOL_HMAC_KEY before starting}
      - QCHEM_ALLOW_LEGACY_PICKLE=0
      - QCHEM_JOB_DATABASE_URL=${QCHEM_JOB_DATABASE_URL:-postgresql://qchem:qchem@postgres:5432/qchem_jobs}
    command: ["qchem-jobs-worker", "--db-url", "postgresql://qchem:qchem@postgres:5432/qchem_jobs", "--workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import qchem_stack; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qchem-api:
    build:
      context: .
      target: slim
    image: qchem-stack:slim
    container_name: qchem-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./configs:/configs:ro
    environment:
      - QCHEM_PROTOCOL_HMAC_KEY=${QCHEM_PROTOCOL_HMAC_KEY:?Set QCHEM_PROTOCOL_HMAC_KEY before starting}
      - QCHEM_ALLOW_LEGACY_PICKLE=0
      - QCHEM_STACK_API_KEY=${QCHEM_STACK_API_KEY:?Set QCHEM_STACK_API_KEY before starting}
      - QCHEM_STACK_REQUIRE_API_KEY=${QCHEM_STACK_REQUIRE_API_KEY:-1}
      - QCHEM_API_HOST=0.0.0.0
      - QCHEM_API_PORT=8000
      - QCHEM_JOB_DB=/data/jobs.sqlite
    command: ["python", "-m", "qchem_stack.api", "--host", "0.0.0.0", "--port", "8000", "--db", "/data/jobs.sqlite"]
    restart: unless-stopped
    depends_on:
      qchem-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    name: qchem-network

volumes:
  qchem_pg_data:
