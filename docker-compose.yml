version: '3.8'

services:
  qchem-worker:
    build: .
    image: qchem-stack:latest
    container_name: qchem-worker
    volumes:
      - ./data:/data
      - ./configs:/configs
    environment:
      - QCHEM_PROTOCOL_HMAC_KEY=${QCHEM_PROTOCOL_HMAC_KEY:-dev-hmac-key-change-in-production}
      - QCHEM_ALLOW_LEGACY_PICKLE=0
    command: ["qchem-jobs-worker", "--db", "/data/jobs.sqlite", "--workers", "4"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import qchem_stack; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qchem-api:
    build: .
    image: qchem-stack:latest
    container_name: qchem-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./configs:/configs
    environment:
      - QCHEM_PROTOCOL_HMAC_KEY=${QCHEM_PROTOCOL_HMAC_KEY:-dev-hmac-key-change-in-production}
      - QCHEM_ALLOW_LEGACY_PICKLE=0
      - QCHEM_API_HOST=0.0.0.0
      - QCHEM_API_PORT=8000
    command: ["python", "-m", "qchem_stack.api", "--host", "0.0.0.0", "--port", "8000", "--db", "/data/jobs.sqlite"]
    restart: unless-stopped
    depends_on:
      qchem-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data:
    driver: local

networks:
  default:
    name: qchem-network
